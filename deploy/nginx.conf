# ==============================================================================
# DYF Leather Atelier — Production Nginx Configuration (FE-025)
# Serves Landing Page, Admin SPA, VIP Catalog SPA & Proxies API/Uploads
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        # Standard Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static assets with content hash — 1 year immutable cache
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # 1. Main Landing Page
        location = / {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files /index.html =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files /index.html =404;
        }

        # 2. VIP Catalog App (Vue 3 Hash SPA)
        location /catalog {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri $uri/ /catalog.html;
        }

        location = /catalog.html {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files /catalog.html =404;
        }

        # 3. Admin Panel App (Vue 3 Hash SPA)
        location /admin {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri $uri/ /admin.html;
        }

        location = /admin.html {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files /admin.html =404;
        }

        # 4. Reverse Proxy for Backend API
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 5. Reverse Proxy for Uploaded Media
        location /uploads/ {
            proxy_pass http://backend:8080/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Custom error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
