<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیش‌نمایش لوگوی سه‌بعدی تعاملی</title>
  <!-- کتابخانه رسمی گوگل برای نمایش مدل‌های سه‌بعدی در وب (لود محلی یا CDN) -->
  <script type="module" src="model-viewer.min.js"></script>
  <script type="module">
    if (!customElements.get('model-viewer')) {
      const s = document.createElement('script');
      s.type = 'module';
      s.src = 'https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js';
      document.head.appendChild(s);
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at center, #1a1e28 0%, #0d0f14 100%);
      color: #e5e9f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffd700, #ffae19);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      font-size: 14px;
      color: #8c97a8;
    }
    .viewer-container {
      width: 90vw;
      max-width: 650px;
      height: 520px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    .controls-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: #cbd5e1;
      pointer-events: none;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>نشان سه‌بعدی تعاملی وب</h1>
    <p>با درگ کردن موس مدل را بچرخانید، با اسکرول زوم کنید</p>
  </div>

  <div class="viewer-container">
    <model-viewer
      src="emblem_3d.glb"
      alt="3D Luxury Emblem Logo"
      camera-controls
      auto-rotate
      auto-rotate-delay="1000"
      rotation-per-second="25deg"
      interaction-prompt="auto"
      shadow-intensity="1.5"
      shadow-softness="0.8"
      exposure="1.2"
      environment-image="neutral"
      camera-orbit="0deg 75deg 105%">
    </model-viewer>
    <div class="controls-hint">🖱️ چرخش: درگ چپ | زوم: اسکرول | جابه‌جایی: درگ راست</div>
  </div>

</body>
</html>
