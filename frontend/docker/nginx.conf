server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 55m;
    # Catalog tokens and signed media URLs must not appear in request logs.
    access_log off;
    error_log /dev/stderr crit;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; return 200 'ok'; }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    # Never serve private media directly from a shared volume.
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location ~ ^/admin(?:/.*|\.html)?$ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy no-referrer always;
        try_files /admin/index.html =404;
    }
    location ~ ^/catalog(?:/.*|\.html)?$ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy no-referrer always;
        try_files /catalog/index.html =404;
    }
    location / { try_files $uri $uri/ =404; }
}
